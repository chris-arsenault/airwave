services:
  backend:
    image: ghcr.io/chris-arsenault/airwave/backend:${IMAGE_TAG:-latest}
    container_name: airwave-backend
    network_mode: host
    restart: unless-stopped
    volumes:
      - /mnt/apps/shares/public/Music:/mnt/music
      - airwave-data:/data
    environment:
      - RUST_LOG=airwave_server=info
      # Multicast stays available on-link. The VP2440 collector endpoint
      # re-originates approved SSDP on the home subnet for WiiM devices.
      - AIRWAVE_SSDP_TARGETS=${AIRWAVE_SSDP_TARGETS:-239.255.255.250,192.168.66.1}

  frontend:
    image: ghcr.io/chris-arsenault/airwave/frontend:${IMAGE_TAG:-latest}
    container_name: airwave-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  airwave-data:
