services:
  backend:
    image: ghcr.io/chris-arsenault/airwave/backend:${IMAGE_TAG:-latest}
    container_name: airwave-backend
    network_mode: host
    restart: unless-stopped
    volumes:
      - /mnt/apps/shares/public/Music:/mnt/music
      - airwave-data:/data
    environment:
      - RUST_LOG=airwave_server=info
      # Multicast stays available on-link. The ahara-collector appliance on
      # the home LAN re-originates approved SSDP for WiiM devices and
      # returns renderer replies to the fixed response port.
      - AIRWAVE_SSDP_TARGETS=${AIRWAVE_SSDP_TARGETS:-239.255.255.250,192.168.65.10}

  frontend:
    image: ghcr.io/chris-arsenault/airwave/frontend:${IMAGE_TAG:-latest}
    container_name: airwave-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  airwave-data:
